name: Publish Shiftly
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shiftly-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Prepare Node with optional dependency cache
        id: node-cache
        timeout-minutes: 4
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        env:
          # A slow cache is optional; fall back to a clean dependency install.
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: '2'
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare Node without cache if necessary
        if: steps.node-cache.outcome == 'failure'
        timeout-minutes: 4
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:caldav
      - run: pnpm test:sharing
      - run: pnpm test:edit-sync
      - run: node tests/run-api.mjs
      - run: pnpm build
      - run: pnpm test:pages
      - name: Test live release verifier
        run: node --test tests/standalone/release.cjs
      - name: Use reliable Ubuntu mirror for browser dependencies
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' -o -name '*mirrors*.txt' \) -exec sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' {} +
      - name: Install mobile test browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Check iPhone layouts before publishing
        run: pnpm test:mobile
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: iphone-layout-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: standalone-dist
  deploy:
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Verify the deployed app matches this release
        timeout-minutes: 5
        run: node scripts/verify-live.mjs
